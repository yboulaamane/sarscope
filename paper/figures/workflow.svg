<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">SARscope: traceable SAR, from measurements to interpretation</title>
  <desc id="desc">Four user-selected stages: curate a coherent assay, choose a chemical series, inspect matched position changes and cliffs, then review evidence and optionally model. Source records remain linked. Observed SAR is not a mechanism or a prospective prediction.</desc>
  <rect width="920" height="300" fill="white"/>
  <g font-family="Arial, sans-serif">
    <text x="28" y="35" font-size="24" font-weight="bold" fill="#263747">SARscope</text>
    <text x="166" y="35" font-size="16" fill="#596879">Interactive, assay-aware structure–activity interpretation</text>
    <path d="M205 143h26m180 0h26m180 0h26" stroke="#8796a3" stroke-width="3"/>
    <path d="m223 137 8 6-8 6m206-12 8 6-8 6m206-12 8 6-8 6" fill="none" stroke="#8796a3" stroke-width="3"/>
    <rect x="28" y="69" width="177" height="151" rx="14" fill="#eef7f4" stroke="#258b78"/>
    <rect x="231" y="69" width="180" height="151" rx="14" fill="#faf3e9" stroke="#bd8838"/>
    <rect x="437" y="69" width="180" height="151" rx="14" fill="#f4eef8" stroke="#956bb0"/>
    <rect x="643" y="69" width="249" height="151" rx="14" fill="#edf2f6" stroke="#566f83"/>
    <g font-size="15" font-weight="bold" fill="#263747">
      <text x="45" y="103">1  Curate evidence</text>
      <text x="247" y="103">2  Choose a series</text>
      <text x="453" y="103">3  Inspect changes</text>
      <text x="659" y="103">4  Judge the support</text>
    </g>
    <g font-size="12" fill="#425564">
      <text x="45" y="137">Target · assay · endpoint</text>
      <text x="45" y="163">Exact concentrations</text>
      <text x="45" y="189">Keep source record IDs</text>
      <text x="247" y="137">Scaffold and R-sites</text>
      <text x="247" y="163">Map variable positions</text>
      <text x="247" y="189">Report coverage gaps</text>
      <text x="453" y="137">One-position pairs</text>
      <text x="453" y="163">Measured potency delta</text>
      <text x="453" y="189">Explore activity cliffs</text>
      <text x="659" y="137">Effects · contexts · contradictions</text>
      <text x="659" y="163">Inspect and export raw evidence</text>
      <text x="659" y="189">Optional QSAR with held-out tests</text>
    </g>
    <path d="M768 230v12H116v-12" fill="none" stroke="#258b78" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="230" y="264" font-size="14" fill="#258b78">Every statement links back to its supporting measurements.</text>
    <text x="230" y="287" font-size="13" fill="#775345">Observed SAR ≠ causal mechanism ≠ prospective prediction.</text>
  </g>
</svg>
