<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">SARscope: from a substitution effect to a testable evidence gap</title>
  <desc id="desc">Four user-selected stages: select an observed positional change, challenge it by omitting evidence and changing thresholds, inspect chemical contexts and substitution cycles, and export the evidence with a proposed follow-up measurement. Proposals are not potency predictions.</desc>
  <rect width="920" height="300" fill="white"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#76838d"/></marker></defs>
  <g font-family="Arial, sans-serif">
    <text x="25" y="32" font-size="23" font-weight="bold" fill="#263747">SARscope</text>
    <text x="159" y="32" font-size="16" fill="#4a5d6c">What supports this SAR conclusion—and what could change it?</text>
    <path d="M215 143H238M441 143H464M667 143H690" stroke="#76838d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="25" y="65" width="190" height="155" rx="12" fill="#eef7f4" stroke="#258b78"/>
    <rect x="244" y="65" width="197" height="155" rx="12" fill="#faf3e9" stroke="#bd8838"/>
    <rect x="470" y="65" width="197" height="155" rx="12" fill="#f4eef8" stroke="#956bb0"/>
    <rect x="696" y="65" width="199" height="155" rx="12" fill="#edf2f6" stroke="#566f83"/>
    <g font-size="15" font-weight="bold" fill="#263747">
      <text x="39" y="95">1  Select an effect</text>
      <text x="258" y="95">2  Challenge it</text>
      <text x="484" y="95">3  Inspect context</text>
      <text x="710" y="95">4  Plan a check</text>
    </g>
    <g font-size="12" fill="#425564">
      <text x="39" y="128">Same mapped stereo core</text>
      <text x="39" y="154">One changed R-position</text>
      <text x="39" y="180">Shared assay / endpoint</text>
      <text x="39" y="206">Retain source records</text>
      <text x="258" y="128">Omit compounds / contexts</text>
      <text x="258" y="154">Omit assays / publications</text>
      <text x="258" y="180">Change effect thresholds</text>
      <text x="258" y="206">Report absent evidence</text>
      <text x="484" y="128">Separate effect strata</text>
      <text x="484" y="154">Inspect analogue cycles</text>
      <text x="484" y="180">Locate contradictions</text>
      <text x="484" y="206">Expose missing cells</text>
      <text x="710" y="128">Measure a fourth analogue</text>
      <text x="710" y="154">Retest a conflicting pair</text>
      <text x="710" y="180">Export evidence + hashes</text>
      <text x="710" y="206">No potency forecast</text>
    </g>
    <path d="M796 229V242H119V229" fill="none" stroke="#258b78" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="177" y="267" font-size="14" fill="#258b78">Every conclusion remains linked to its measurements and scope.</text>
    <text x="190" y="289" font-size="13" fill="#775345">Sign retention is not statistical confidence or experimental validation.</text>
  </g>
</svg>
