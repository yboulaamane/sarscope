name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/sarscope
      # The whole suite gates CI now that the analysis layer is implemented.
      # Network tests never run in CI: they call the live ChEMBL API.
      - run: pytest -q -m "not network"

  field-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            constraints: benchmarks/field_qsar/compatibility-constraints-py312.txt
          - python: "3.13"
            constraints: benchmarks/field_qsar/compatibility-constraints-py313.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]" -c "${{ matrix.constraints }}"
      - run: pip check
      # Offline own-method verification, not a predictive-model certificate.
      - run: >-
          pytest -q tests/test_field_numerics.py tests/test_field_campaign.py
          tests/test_field_qsar.py tests/test_field_reproduction.py
          tests/test_field_reference.py tests/test_field_sensitivity.py
          tests/test_tripos_reference.py tests/test_field_qualification.py
          tests/test_alignment_worker.py
          tests/test_generated_alignment_validation.py
          tests/test_mmff_fields.py tests/test_mmff_field_count_audit.py
          tests/test_end_to_end_demo_evidence.py tests/test_external_qsar_evidence.py
          --junitxml=field-verification.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-verification-python-${{ matrix.python }}
          path: field-verification.xml

  docking-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y autodock-vina
      - run: pip install -e ".[dev,app,docking]"
      # Pinned dependency setup; tests make no RCSB/ChEMBL requests.
      - run: python -c "from sarscope.receptor_worker import _install_fpocket; _install_fpocket()"
      # Synthetic and offline: engine integration, not target-level validation.
      - run: pytest -q tests/test_docking.py tests/test_app_docking.py tests/test_receptor.py tests/test_app_receptor.py tests/test_ligand_states.py tests/test_app_ligand_states.py tests/test_conformers.py
