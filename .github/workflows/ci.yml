name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/sarscope
      # The whole suite gates CI now that the analysis layer is implemented.
      # Network tests never run in CI: they call the live ChEMBL API.
      - run: pytest -q -m "not network"
