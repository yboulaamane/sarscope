<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">How SARscope works</title>
  <desc id="desc">Four opt-in stages: confirm a ChEMBL target, curate assay evidence, explore structure-activity relationships, and validate a predictive model. PubChem qualitative screening is a separate workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30263e"/>
      <stop offset="1" stop-color="#1b1b2a"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#52dfb6"/>
      <stop offset=".52" stop-color="#c59bff"/>
      <stop offset="1" stop-color="#ffca76"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1118" height="318" rx="22" fill="url(#background)" stroke="#695979"/>
  <text x="33" y="37" fill="#f5f1f9" font-family="Arial, sans-serif" font-size="23" font-weight="700">From target evidence to defensible SAR</text>
  <text x="34" y="58" fill="#cfc1db" font-family="Arial, sans-serif" font-size="12">ChEMBL potency workflow · choose each stage; nothing runs automatically</text>

  <g transform="translate(32 77)">
    <rect width="242" height="183" rx="15" fill="#292537" stroke="#5c4e6b"/>
    <circle cx="35" cy="35" r="22" fill="#244a46"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="#52dfb6" stroke-width="3"/>
    <path d="M39 39 L48 48" stroke="#52dfb6" stroke-width="3" stroke-linecap="round"/>
    <text x="20" y="90" fill="#52dfb6" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">01 · FIND</text>
    <text x="20" y="116" fill="#f5f1f9" font-family="Arial, sans-serif" font-size="18" font-weight="700">Choose a target</text>
    <text x="20" y="143" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">ID, gene, protein or disease</text>
    <text x="20" y="163" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Confirm the exact target ID</text>
  </g>
  <path d="M280 168 H293 M287 162 L293 168 L287 174" fill="none" stroke="#9b87ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(300 77)">
    <rect width="242" height="183" rx="15" fill="#292537" stroke="#5c4e6b"/>
    <circle cx="35" cy="35" r="22" fill="#443354"/>
    <path d="M24 26 H47 L39 36 V47 L32 43 V36 Z" fill="none" stroke="#c59bff" stroke-width="2.6" stroke-linejoin="round"/>
    <text x="20" y="90" fill="#c59bff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">02 · CURATE</text>
    <text x="20" y="116" fill="#f5f1f9" font-family="Arial, sans-serif" font-size="18" font-weight="700">Audit the evidence</text>
    <text x="20" y="143" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Assay, unit, variant, source</text>
    <text x="20" y="163" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Record every exclusion</text>
  </g>
  <path d="M548 168 H561 M555 162 L561 168 L555 174" fill="none" stroke="#9b87ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(568 77)">
    <rect width="242" height="183" rx="15" fill="#292537" stroke="#5c4e6b"/>
    <circle cx="35" cy="35" r="22" fill="#52402e"/>
    <path d="M35 21 L47 28 V42 L35 49 L23 42 V28 Z" fill="none" stroke="#ffca76" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="47" cy="28" r="3.8" fill="#ff8194"/>
    <text x="20" y="90" fill="#ffca76" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">03 · EXPLORE</text>
    <text x="20" y="116" fill="#f5f1f9" font-family="Arial, sans-serif" font-size="18" font-weight="700">Understand SAR</text>
    <text x="20" y="143" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Scaffolds, pairs, cliffs</text>
    <text x="20" y="163" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Inspect structural effects</text>
  </g>
  <path d="M816 168 H829 M823 162 L829 168 L823 174" fill="none" stroke="#9b87ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(836 77)">
    <rect width="242" height="183" rx="15" fill="#292537" stroke="#5c4e6b"/>
    <circle cx="35" cy="35" r="22" fill="#50313f"/>
    <path d="M23 46 V24 M23 46 H49" fill="none" stroke="#ff8194" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="29" cy="40" r="3" fill="#ff8194"/>
    <circle cx="37" cy="33" r="3" fill="#ffca76"/>
    <circle cx="46" cy="27" r="3" fill="#52dfb6"/>
    <text x="20" y="90" fill="#ff8194" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">04 · VALIDATE</text>
    <text x="20" y="116" fill="#f5f1f9" font-family="Arial, sans-serif" font-size="18" font-weight="700">Build a QSAR model</text>
    <text x="20" y="143" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Potency or activity classes</text>
    <text x="20" y="163" fill="#d6cddd" font-family="Arial, sans-serif" font-size="13">Check splits, errors, domain</text>
  </g>

  <rect x="32" y="273" width="1046" height="30" rx="10" fill="#262337" stroke="#594b68"/>
  <circle cx="47" cy="288" r="4" fill="#ffca76"/>
  <text x="59" y="293" fill="#ded3e6" font-family="Arial, sans-serif" font-size="12">Separate workflow: PubChem qualitative screening stays Active / Inactive and is never converted to pIC50.</text>
  <path d="M33 313 H1077" stroke="url(#bottom)" stroke-width="3" stroke-linecap="round"/>
</svg>
