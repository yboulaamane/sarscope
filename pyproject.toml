[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarscope"
version = "0.1.0.dev0"
description = "Target ID in, structure-activity report out: ChEMBL curation, scaffold enrichment, activity cliffs and leak-free QSAR in one command."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cheminformatics", "drug-discovery", "rdkit", "chembl", "qsar",
    "structure-activity-relationship", "activity-cliffs", "scaffold-analysis",
]
authors = [{ name = "Yassir Boulaamane", email = "yassirxmail@gmail.com" }]

dependencies = [
    # Standardisation, scaffolds and fingerprints come from Sorbent rather than
    # being rewritten here. See src/sarscope/chem.py for what is and is not reused.
    "sorbent>=0.1.0",
    "rdkit>=2024.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# PubChem fingerprints without Java/PaDEL. Caution: scikit-fingerprints pins an
# upper bound on rdkit, so installing this extra can downgrade RDKit.
pubchem = ["scikit-fingerprints>=2.0"]
# The browser app (streamlit_app.py).
app = ["streamlit>=1.38"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/yboulaamane/sarscope"
Repository = "https://github.com/yboulaamane/sarscope"
Issues = "https://github.com/yboulaamane/sarscope/issues"

[project.scripts]
sarscope = "sarscope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sarscope*"]

[tool.setuptools.package-data]
sarscope = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "science: specification tests for the analysis layer (fail until the stubs are implemented)",
    "network: tests that call the live ChEMBL API (deselected by default in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

# Same reasoning as in Sorbent: RDKit ships no py.typed marker and builds many
# attributes dynamically, so following it yields false attr-defined errors.
[[tool.mypy.overrides]]
module = ["rdkit.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
